name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  laravel-tests:
    name: Laravel (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       deveduhub_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions:  pdo, pdo_pgsql, redis, bcmath, pcntl
          coverage:    none

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key:  composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer deps
        run: cd backend && composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cd backend && cp .env.example .env

      - name: Configure test environment
        run: |
          cd backend
          php artisan key:generate
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/'      .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=deveduhub_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/'   .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

      - name: Enable pgcrypto
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -d deveduhub_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'

      - name: Run migrations
        run: cd backend && php artisan migrate --force

      - name: Run tests (parallel)
        run: cd backend && php artisan test --parallel --stop-on-failure

  python-tests:
    name: Python Grader (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: grader/requirements.txt

      - name: Install dependencies
        run: cd grader && pip install -r requirements.txt pytest

      - name: Run tests
        run: cd grader && pytest test_grader.py -v --tb=short

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [laravel-tests, python-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Laravel image
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/docker/Dockerfile.laravel
          push:       false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags:       deveduhub-app:ci

      - name: Build Grader image
        uses: docker/build-push-action@v5
        with:
          context:    ./grader
          file:       ./grader/Dockerfile
          push:       false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags:       deveduhub-grader:ci

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       false
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags:       deveduhub-frontend:ci

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key:  composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install deps
        run: cd backend && composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: cd backend && find app -name '*.php' -exec php -l {} \; | grep -v "^No syntax errors" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
