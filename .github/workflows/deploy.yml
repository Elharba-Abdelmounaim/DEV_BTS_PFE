name: Deploy

on:
  push:
    tags:
      - 'v*'          # v1.0.0, v1.2.3 → staging
      - 'release/*'   # release/prod   → production

env:
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/deveduhub

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build & push all images to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # Laravel app
      - name: Build & push app
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       docker/Dockerfile.laravel
          push:       true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-app:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-app:latest

      # Python grader
      - name: Build & push grader
        uses: docker/build-push-action@v5
        with:
          context:    ./grader
          file:       ./grader/Dockerfile
          push:       true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-grader:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-grader:latest

      # React frontend
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Deploy to staging  (all v* tags)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /srv/deveduhub

            # Pull latest images
            docker compose pull app grader frontend

            # Zero-downtime: migrate first, then restart app
            docker compose run --rm app php artisan migrate --force
            docker compose up -d --no-deps app worker notifier scheduler nginx frontend

            # Health check
            sleep 10
            curl -sf http://localhost:8080/api/health || (echo "Health check failed" && exit 1)
            curl -sf http://localhost:8000/health     || (echo "Grader health check failed" && exit 1)

            echo "Staging deploy ✓ — ${{ needs.build-and-push.outputs.tag }}"

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to production  (release/* tags only, requires manual approval)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production        # GitHub environment with required reviewers
    if: startsWith(github.ref_name, 'release/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /srv/deveduhub

            docker compose pull app grader frontend

            # Maintenance mode on
            docker compose exec -T app php artisan down --secret="${{ secrets.MAINTENANCE_SECRET }}"

            docker compose run --rm app php artisan migrate --force
            docker compose up -d --no-deps app worker notifier scheduler nginx frontend

            # Maintenance mode off
            docker compose exec -T app php artisan up

            # Cache optimisation
            docker compose exec -T app php artisan optimize

            sleep 15
            curl -sf https://deveduhub.com/api/health || (echo "Production health check failed" && exit 1)

            echo "Production deploy ✓ — ${{ needs.build-and-push.outputs.tag }}"
